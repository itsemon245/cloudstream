name: Artifact Build

# Pull requests run the checks. Pushes to master run the same jobs so their Gradle cache is
# saved on master, which is the only branch every pull request can restore a cache from.
# See docs/ci.md.
on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

# A new push to a pull request cancels its older run. Master runs always finish, so the
# cache they save is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The APK, every module's unit tests and, when needed, the ABI check. Lint runs at the same
  # time in its own job: both take a few minutes and neither needs the other's output.
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # The merge commit plus its parents, so the ABI step can see what this PR changes.
        fetch-depth: 2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # Lets the configuration cache be saved and restored. Create the secret as described
        # in docs/ci.md; without it everything else still works.
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        # Only master writes the cache: pull requests can't read each other's caches, so
        # their entries would only push master's out of the 10 GB limit.
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    - name: Ensure binary compatibility
      # This is to ensure that your code is backwards compatible.
      # If this fails you need to add a @Prerelease annotation to new code.
      # Upstream's master often fails this check on its own (it only runs on their pull
      # requests), so only check the ABI when this pull request changes the library.
      # Master pushes never check it: master already holds upstream's ABI as it is.
      if: github.event_name == 'pull_request'
      run: |
        if git diff --quiet HEAD^1 HEAD -- library; then
          echo "This pull request doesn't change the library; skipping the ABI check."
        else
          ./gradlew :library:checkKotlinAbi
        fi

    # Named tasks instead of `check`: in the app, `check` would also compile and unit-test the
    # stable flavor, a second copy of the same code, and in library and shared it would run
    # lint, which the Lint job does. allTests runs every test target of a multiplatform module.
    - name: Build and run unit tests
      run: >-
        ./gradlew
        :app:assemblePrereleaseDebug
        :app:testPrereleaseDebugUnitTest
        :library:allTests
        :shared:allTests
        :desktopApp:allTests
        :docs:test

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "app/build/outputs/apk/prerelease/debug/*.apk"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    - name: Lint
      run: ./gradlew lint

    - name: Upload lint reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: lint-reports
        path: "*/build/reports/lint-results-*.html"
